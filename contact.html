<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Franky Dustman</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html">Franky Dustman</a>
        <nav class="site-nav">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="resume.html">Resume</a>
          <a href="contact.html" class="active">Contact</a>
        </nav>
      </div>
    </header>

    <main class="container page">
      <section class="card">
        <h1>Contact</h1>
        <p>Email: hello@frankydustman.com</p>
        <p>Location: Remote / Available worldwide</p>
        <form class="contact-form">
          <label>
            Name
            <input type="text" name="name" placeholder="Your name" />
          </label>
          <label>
            Email
            <input type="email" name="email" placeholder="Your email" />
          </label>
          <label>
            Message
            <textarea name="message" rows="5" placeholder="Tell me about your project"></textarea>
          </label>
          <button class="btn btn-primary" type="submit">Send Message</button>
        </form>
      </section>
    </main>
  </body>
</html>
